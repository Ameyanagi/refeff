[package]
name = "refeff-linalg"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "faer-backed linear algebra bridge (LU solves, eigensolvers, FEFF-compatible kernels) for the refeff FEFF10 port"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ndarray.workspace = true
num-complex.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { workspace = true, features = ["default"] }

# faer's Rayon backend pulls in native-only atomic-wait through spindle.
[target.'cfg(target_arch = "wasm32")'.dependencies]
faer = { workspace = true, features = ["std", "linalg"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "linalg"
harness = false
