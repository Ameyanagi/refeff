[package]
name = "refeff-cli"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for refeff, a pure-Rust port of the FEFF10 X-ray spectroscopy code"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
refeff-engine = { path = "../refeff-engine", version = "0.1.1", default-features = false, features = ["full"] }
refeff-io = { path = "../refeff-io", version = "0.1.1" }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "refeff"
path = "src/bin/refeff.rs"
test = false

