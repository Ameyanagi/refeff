test = false

[[bin]]
name = "rdinp"
path = "src/bin/rdinp.rs"
test = false

[[bin]]
name = "pot"
path = "src/bin/pot.rs"
test = false

[[bin]]
name = "atomic"
path = "src/bin/atomic.rs"
test = false

[[bin]]
name = "band"
path = "src/bin/band.rs"
test = false

[[bin]]
name = "mdff"
path = "src/bin/mdff.rs"
test = false
