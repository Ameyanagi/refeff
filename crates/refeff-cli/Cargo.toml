[package]
name = "refeff-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
ndarray.workspace = true
num-complex.workspace = true
refeff-core = { path = "../refeff-core" }
refeff-io = { path = "../refeff-io" }
refeff-linalg = { path = "../refeff-linalg" }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
