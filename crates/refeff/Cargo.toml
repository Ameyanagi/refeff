[package]
name = "refeff"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
description = "Typed library facade for the pure-Rust FEFF10 port"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
full = ["refeff-engine/full"]
exafs = ["refeff-engine/exafs"]
sfconv = ["refeff-engine/sfconv"]
serde = ["dep:serde"]

[dependencies]
refeff-engine = { path = "../refeff-engine", version = "0.1.3", default-features = false }
refeff-core = { path = "../refeff-core", version = "0.1.3" }
refeff-io = { path = "../refeff-io", version = "0.1.3" }
serde = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
