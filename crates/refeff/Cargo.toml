[package]
name = "refeff"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Typed library facade for the pure-Rust FEFF10 compatibility pipeline"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
refeff-cli = { path = "../refeff-cli", version = "0.1.1" }
refeff-core = { path = "../refeff-core", version = "0.1.1" }
refeff-io = { path = "../refeff-io", version = "0.1.1" }
serde = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
