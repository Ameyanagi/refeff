[workspace]
members = [
    "crates/refeff-core",
    "crates/refeff",
    "crates/refeff-io",
    "crates/refeff-linalg",
    "crates/refeff-engine",
    "crates/refeff-cli",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["refeff contributors"]
repository = "https://github.com/Ameyanagi/refeff"
keywords = ["xafs", "exafs", "xanes", "feff", "spectroscopy"]
categories = ["science"]

[workspace.lints.rust]
# Package roots use `forbid(unsafe_code)` for production. `deny` here still
# protects auxiliary targets while permitting audited dependency macros (such
# as Criterion's generated benchmark entry point) to scope their own allowance.
unsafe_code = "deny"

[workspace.lints.clippy]
# Keep the broad style groups available for local opt-in without turning
# inherited lints into a repository-wide formatting/API migration. CI promotes
# the independently configured panic-family policy below to hard errors.
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
anyhow = "1.0.98"
approx = "0.5.1"
clap = { version = "4.5.38", features = ["derive"] }
clap_complete = "4.5"
criterion = "0.5.1"
faer = { version = "0.24.0", default-features = true }
ndarray = { version = "0.17.2", default-features = true, features = ["approx", "rayon"] }
num-complex = "0.4.6"
proptest = "1"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
