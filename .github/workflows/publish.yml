name: Publish crates.io release

on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Successful workflow run ID containing the reviewed release-parity-evidence artifact
        required: true
        type: string
      confirm:
        description: Type PUBLISH to release the workspace crates
        required: true
        type: string

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    name: Publish workspace crates
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Require the default branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Require parity evidence from this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$EVIDENCE_RUN" --json headSha,conclusion > /tmp/evidence-run.json
          jq -e --arg sha "$GITHUB_SHA" '.headSha == $sha and .conclusion == "success"' /tmp/evidence-run.json
          gh run download "$EVIDENCE_RUN" -n release-parity-evidence -D target/release-evidence
          python3 scripts/release-evidence.py target/release-evidence/evidence.json
          cargo run -p xtask --locked -- release-readiness
          cargo run -p xtask --locked -- verify-evidence

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo metadata --format-version 1 --no-deps --locked \
            > target/release-metadata.json
          jq -e '
            all(
              .packages[] | select(.name != "xtask");
              .license == "MIT OR Apache-2.0"
            )
          ' target/release-metadata.json
          for crate in \
            refeff-linalg \
            refeff-core \
            refeff-io \
            refeff-engine \
            refeff \
            refeff-cli
          do
            cmp LICENSE "crates/${crate}/LICENSE"
            cargo package --locked --list -p "$crate" \
              | tee "target/${crate}-package-files.txt"
            grep -Eq '(^|/)README\.md$' "target/${crate}-package-files.txt"
            grep -Eq '(^|/)LICENSE$' "target/${crate}-package-files.txt"
          done

      - name: Publish in dependency order
        shell: bash
        run: |
          set -euo pipefail

          wait_for_registry() {
            local package="$1"
            local version="$2"

            for attempt in $(seq 1 60); do
              if cargo info --registry crates-io "${package}@${version}" \
                >/dev/null 2>&1
              then
                echo "${package} ${version} is available from crates.io"
                return 0
              fi

              echo "Waiting for ${package} ${version} to reach the registry (${attempt}/60)"
              sleep 10
            done

            echo "::error::Timed out waiting for ${package} ${version}"
            return 1
          }

          publish_one() {
            local package="$1"
            local version="$2"

            if cargo info --registry crates-io "${package}@${version}" \
              >/dev/null 2>&1
            then
              echo "${package} ${version} is already published; skipping"
              return 0
            fi

            cargo publish --locked -p "$package"
            wait_for_registry "$package" "$version"
          }

          for package in refeff-linalg refeff-core refeff-io refeff-engine refeff refeff-cli; do
            version=$(jq -er --arg package "$package" '.packages[] | select(.name == $package) | .version' target/release-metadata.json)
            publish_one "$package" "$version"
          done
