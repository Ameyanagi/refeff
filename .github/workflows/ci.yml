name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Lightweight quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-quality
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report presentation contracts
        run: node --test scripts/report/*.test.mjs
      - name: Release gate contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: CLI subprocess and facade contracts
        run: cargo test -p refeff-cli -p refeff -p refeff-linalg --locked
      - name: Read pinned FEFF reference revision
        id: feff-reference
        run: echo "revision=$(jq -er '.upstream.revision' compatibility/feff10.json)" >> "$GITHUB_OUTPUT"
      - name: Fetch reference inputs for writer round trips
        uses: actions/checkout@v4
        with:
          repository: times-software/feff10
          ref: ${{ steps.feff-reference.outputs.revision }}
          path: feff10
          persist-credentials: false
          sparse-checkout: |
            examples/EXAFS/Cu
            examples/EXAFS/GeCl_4
            examples/XANES/GeCl_4
            examples/RIXS
      - name: Input and codec contracts
        run: |
          cargo test -p refeff-io model:: --locked
          cargo test -p refeff-io pad:: --locked
          cargo test -p refeff-io codec:: --locked
      - name: Cache integrity contracts
        run: |
          cargo test -p refeff-engine --lib cache::tests:: --locked
      - name: RIXS upstream cached-output contracts
        env:
          REFEFF_REQUIRE_FIXTURES: "1"
        run: cargo test -p refeff-engine --lib upstream_reference --locked
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Keep the embedding API free of CLI dependencies
        shell: bash
        run: |
          cargo tree -p refeff --locked -e normal --prefix none > target/refeff-normal-deps.txt
          if grep -Eq '^(refeff-cli|clap|clap_builder|clap_complete|clap_derive|clap_lex) v' target/refeff-normal-deps.txt; then
            echo "The refeff embedding API unexpectedly depends on CLI crates:"
            grep -E '^(refeff-cli|clap|clap_builder|clap_complete|clap_derive|clap_lex) v' target/refeff-normal-deps.txt
            exit 1
          fi
          cargo tree -p refeff-cli --locked -e normal --prefix none > target/refeff-cli-normal-deps.txt
          grep -Eq '^clap v' target/refeff-cli-normal-deps.txt

  wasm:
    name: WASI and browser execution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and WASI target
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-wasip1
      - name: Cache WASI and native release dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wasm/package-lock.json
      - name: Check WASI CLI and reduced embedding features
        run: |
          cargo check -p refeff-cli --bins --target wasm32-wasip1 --locked
          cargo check -p refeff --no-default-features --target wasm32-wasip1 --locked
          cargo check -p refeff --no-default-features --features exafs --target wasm32-wasip1 --locked
          cargo check -p refeff --no-default-features --features exafs,sfconv --target wasm32-wasip1 --locked
          cargo check -p refeff --all-features --target wasm32-wasip1 --locked
      - name: Build browser artifacts and native parity reference
        run: |
          npm ci --prefix wasm
          npm run build --prefix wasm
          cargo build --release -p refeff-cli --bin refeff --locked
      - name: WASI facade, cancellation and typed spectrum contracts
        run: |
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="node $GITHUB_WORKSPACE/wasm/run-wasi.mjs"
          cargo test --release -p refeff --target wasm32-wasip1 --lib --test execution --locked -- --test-threads 1
      - name: Native, WASI and browser filesystem spectrum parity
        run: npm test --prefix wasm
      - name: Browser worker execution and cancellation
        working-directory: wasm
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

  features:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        features: [none, exafs, 'exafs,sfconv', full, all]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Name the feature cache
        id: feature-cache
        env:
          FEATURES: ${{ matrix.features }}
        # GitHub cache keys cannot contain commas.
        run: echo "key=${FEATURES//,/-}" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies for this feature configuration
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: features-${{ steps.feature-cache.outputs.key }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check reduced API and feature contracts
        shell: bash
        run: |
          flags=(--no-default-features)
          if [ "${{ matrix.features }}" = all ]; then
            flags=(--all-features)
          elif [ "${{ matrix.features }}" != none ]; then
            flags+=(--features "${{ matrix.features }}")
          fi
          cargo check -p refeff --locked "${flags[@]}"
          cargo test -p refeff-engine --test feature_selection --locked "${flags[@]}"
